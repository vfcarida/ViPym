name: CI / Quality & Automated Testing

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-format:
    name: Code Style & Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Linting Tools
        run: |
          pip install ruff mypy types-pyyaml

      - name: Run Ruff Linter
        run: ruff check .

      - name: Run Ruff Format Check
        run: ruff format --check .

  test-matrix:
    name: Test Suite (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install ViPym and Test Dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev,torch]"

      - name: Run Unit & Contract Tests
        env:
          VIPYM_ALLOW_UNSAFE: "1"
        run: |
          pytest tests/unit/ tests/contract/ -v

      - name: Run CLI Workflow & Smoke Tests
        env:
          VIPYM_ALLOW_UNSAFE: "1"
        run: |
          pytest tests/e2e/ -v
