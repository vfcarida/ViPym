name: GPU Integration Test Pipeline

on:
  pull_request:
    branches:
      - main
      - master
    paths:
      - "src/vipym/compression/**"
      - "src/vipym/evaluation/**"
      - "src/vipym/models/**"
      - "src/vipym/pipelines/**"
      - "src/vipym/distillation/**"
      - "tests/integration/**"
      - ".github/workflows/gpu-integration.yml"
      - "pyproject.toml"

  push:
    branches:
      - main
    paths:
      - "src/vipym/compression/**"
      - "src/vipym/evaluation/**"
      - "src/vipym/models/**"
      - "src/vipym/pipelines/**"
      - "tests/integration/**"
      - ".github/workflows/gpu-integration.yml"

  schedule:
    # Run weekly on Sunday at 02:00 UTC
    - cron: "0 2 * * 0"

  workflow_dispatch:
    inputs:
      pytest_args:
        description: "Custom pytest arguments"
        required: false
        default: "tests/integration/ -v --durations=10"
      device_mode:
        description: "Execution hardware target (gpu / auto)"
        required: false
        default: "gpu"

concurrency:
  group: gpu-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gpu-integration-tests:
    name: GPU Integration Suite (PyTorch + CUDA)
    # Target self-hosted GPU runner, fallback to standard runner with matrix for flexibility
    runs-on: ${{ (github.repository == 'vfcarida/ViPym' && contains(github.event_name, 'schedule')) && fromJSON('["self-hosted", "linux", "x64", "gpu"]') || 'ubuntu-latest' }}
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Restore Hugging Face Models Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch
          key: hf-models-cache-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            hf-models-cache-${{ runner.os }}-
            hf-models-cache-

      - name: Verify GPU availability
        run: |
          if command -v nvidia-smi &> /dev/null; then
            echo "NVIDIA GPU Detected:"
            nvidia-smi
          else
            echo "No physical NVIDIA GPU detected on this runner; executing in accelerated CPU emulation mode."
          fi

      - name: Install ViPym and Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[all]"

      - name: Validate ViPym Environment
        run: |
          python -c "import torch; print(f'PyTorch: {torch.__version__}, CUDA Available: {torch.cuda.is_available()}')"
          vipym --help

      - name: Run End-to-End GPU Integration Tests
        run: |
          pytest ${{ github.event.inputs.pytest_args || 'tests/integration/ -v --durations=10' }}

      - name: Upload Test Results Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-integration-test-results
          path: |
            .pytest_cache/
            artifacts/
          if-no-files-found: ignore
