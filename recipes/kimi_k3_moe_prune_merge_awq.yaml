# ViPym Production Recipe: Kimi K3 MoE Compression Pipeline
# Architecture: Kimi K3 (2.8T MoE) -> Wanda Pruning 25% -> AWQ 4-bit Quantization -> FP8 KV-Cache
# Target: Production deployment on AWS p5.48xlarge cluster

experiment_id: recipe-kimi-k3-moe-prune-merge-awq
seed: 42
description: "Kimi K3 MoE compression pipeline: Expert Pruning, AWQ 4-bit quantization, and FP8 KV-Cache."

model:
  id: "moonshotai/Kimi-K3"
  revision: "main"
  trust_remote_code: true
  custom_adapter_cls: "kimi_k3"

compression_pipeline:
  - stage_id: "prune_experts"
    method: "prune_wanda"
    scheme: "UNSTRUCTURED_SPARSITY"
    dependencies: []
    calibration:
      dataset_name: "bigcode/the-stack"
      num_samples: 512
      sequence_length: 2048
    parameters:
      sparsity: 0.25
      prune_type: "unstructured"
      per_expert_sparsity: true

  - stage_id: "quantize_awq"
    method: "awq"
    scheme: "W4A16"
    dependencies: ["prune_experts"]
    calibration:
      dataset_name: "bigcode/the-stack"
      num_samples: 512
      sequence_length: 2048
    parameters:
      bits: 4
      group_size: 128
      zero_point: true

  - stage_id: "kv_cache_fp8"
    method: "kv_cache_fp8"
    scheme: "FP8"
    dependencies: ["quantize_awq"]
    parameters:
      kv_dtype: "fp8_e4m3"

serving:
  backend: "vllm"
  tensor_parallel_size: 64
  max_model_len: 16384
  gpu_memory_utilization: 0.90
  kv_cache_dtype: "fp8_e4m3"

evaluation:
  suites:
    - "humaneval"
    - "mbpp"
    - "swebench"
  timeout_per_task_sec: 25
  temperature: 0.0
  max_new_tokens: 2048
  pass_k_values: [1]
  isolate_with_gvisor: true

cost_assumptions:
  provider: "aws"
  region: "us-east-1"
  pricing_source: "config"
  aws_ec2_hourly_rate: 32.77
  active_gpu_count: 64

optimization:
  objectives:
    - "maximize_quality"
    - "minimize_latency"
    - "minimize_cost"
  min_acceptable_pass_at_1: 0.70
  max_acceptable_vram_gb: 1600.0

infrastructure:
  provider: "aws_ec2"
  instance_type: "p5.48xlarge"
