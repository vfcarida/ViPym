# ViPym Production Recipe: Kimi K3 (2.8T MoE) to Dense 32B Distillation Pipeline
# Pipeline stages:
#   1. prune_experts   - Wanda unstructured pruning on least active routing paths
#   2. distill_32b     - Distill MoE teacher into Dense Qwen2.5-32B student model
#   3. quantize_awq    - 4-bit AWQ quantization on student model

experiment_id: recipe-kimi-k3-to-dense-32b-distillation
seed: 42
description: "Kimi K3 (2.8T MoE) distillation into dense 32B student model with response and logit matching."

model:
  id: "moonshotai/Kimi-K3"
  revision: "main"
  trust_remote_code: true
  custom_adapter_cls: "kimi_k3"

compression_pipeline:
  - stage_id: "prune_experts"
    method: "prune_wanda"
    scheme: "UNSTRUCTURED_SPARSITY"
    dependencies: []
    calibration:
      dataset_name: "bigcode/the-stack"
      num_samples: 512
      sequence_length: 2048
    parameters:
      sparsity: 0.25
      prune_type: "unstructured"

  - stage_id: "distill_32b"
    method: "distill_response"
    scheme: "DISTILL_STUDENT"
    dependencies: ["prune_experts"]
    parameters:
      student_model_id: "Qwen/Qwen2.5-Coder-32B-Instruct"
      num_samples: 1000
      temperature: 1.0

  - stage_id: "quantize_awq"
    method: "awq"
    scheme: "W4A16"
    dependencies: ["distill_32b"]
    calibration:
      dataset_name: "bigcode/the-stack"
      num_samples: 512
      sequence_length: 2048
    parameters:
      bits: 4
      group_size: 128
      zero_point: true

serving:
  backend: "vllm"
  tensor_parallel_size: 4
  max_model_len: 16384
  gpu_memory_utilization: 0.90
  kv_cache_dtype: "fp8_e4m3"

evaluation:
  suites:
    - "humaneval"
    - "mbpp"
    - "swebench"
  timeout_per_task_sec: 25
  temperature: 0.0
  max_new_tokens: 2048
  pass_k_values: [1]
  isolate_with_gvisor: true

cost_assumptions:
  provider: "aws"
  region: "us-east-1"
  pricing_source: "config"
  aws_ec2_hourly_rate: 16.00
  active_gpu_count: 4

optimization:
  objectives:
    - "maximize_quality"
    - "minimize_latency"
    - "minimize_cost"
  min_acceptable_pass_at_1: 0.70
  max_acceptable_vram_gb: 80.0

infrastructure:
  provider: "aws_ec2"
  instance_type: "p4de.24xlarge"
